<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лицей-Сеть №37</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0c0c; color: #ffffff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #111; border-bottom: 2px solid #ff003c; }
        .logo { font-size: 18px; font-weight: bold; color: #ff003c; text-transform: uppercase; }
        .tabs { display: flex; justify-content: center; background: #161616; }
        .tab-btn { padding: 12px 20px; background: none; border: none; color: #888; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        .tab-btn.active { color: #ff003c; border-bottom: 2px solid #ff003c; font-weight: bold; }
        .tab-content { display: none; padding: 15px; max-width: 600px; margin: 0 auto; }
        .tab-content.active { display: block; }
        .chat-container { background: #161616; border: 1px solid #ff003c; border-radius: 8px; height: 400px; display: flex; flex-direction: column; }
        .chat-header { background: #ff003c; padding: 10px; font-weight: bold; text-align: center; font-size: 14px; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .msg.bot { background: #222; align-self: flex-start; border-left: 3px solid #ff003c; white-space: pre-line; }
        .msg.user { background: #ff003c; align-self: flex-end; }
        .chat-input-row { display: flex; padding: 8px; background: #111; }
        .chat-input-row input { flex: 1; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 4px; outline: none; }
        .chat-input-row button { padding: 10px 15px; background: #ff003c; border: none; color: #fff; margin-left: 8px; border-radius: 4px; cursor: pointer; }
        .mchs-btn { width: 100%; padding: 12px; background: #d32f2f; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; margin-bottom: 15px; }
        #mchs-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .mchs-box { background: #1a1a1a; border: 2px solid #d32f2f; padding: 20px; border-radius: 8px; width: 90%; max-width: 450px; }
        .mchs-box h3 { color: #d32f2f; margin-bottom: 10px; text-transform: uppercase; font-size: 16px; }
        .mchs-box p { font-size: 13px; line-height: 1.5; margin-bottom: 15px; }
        .card { background: #161616; padding: 15px; border-radius: 8px; border: 1px solid #222; }
        .card h3 { color: #ff003c; margin-bottom: 8px; font-size: 16px; }
        table { width: 100%; font-size: 13px; text-align: left; }
        th, td { padding: 8px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>
    <header><div class="logo">Лицей-Сеть №37</div></header>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-ai')">ИИ Помощник</button>
        <button class="tab-btn" onclick="switchTab('tab-events')">События</button>
    </div>
    <div id="tab-ai" class="tab-content active">
        <button class="mchs-btn" onclick="document.getElementById('mchs-modal').style.display='flex'">🛡️ РЕГЛАМЕНТ МЧС</button>
        <div class="chat-container">
            <div class="chat-header">Первый — Экспресс-Поиск по Базе Знаний</div>
            <div class="chat-messages" id="ai-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="ai-input" placeholder="Напиши: дискриминант, пифагор, мчс..." onkeydown="if(event.key==='Enter')sendAiMessage()">
                <button onclick="sendAiMessage()">🛩️</button>
            </div>
        </div>
    </div>
    <div id="tab-events" class="tab-content">
        <div class="card">
            <h3>🏆 ТОП Активистов</h3>
            <table>
                <tr><th>Место</th><th>Класс</th><th>Баллы</th></tr>
                <tr><td>1</td><td>9Б</td><td>420</td></tr>
                <tr><td>2</td><td>8А</td><td>390</td></tr>
            </table>
        </div>
    </div>
    <div id="mchs-modal">
        <div class="mchs-box">
            <h3>МЧС Нижнекамск</h3>
            <p>При звуках сирены пройдите в укрытие на цокольный этаж. Обломки БПЛА руками не трогать! Единый номер — 112.</p>
            <button onclick="document.getElementById('mchs-modal').style.display='none'" style="width:100%; padding:10px; background:#333; color:#fff; border:none; border-radius:4px; cursor:pointer;">Закрыть</button>
        </div>
    </div>
    <script>
        let megaDatabase = {};
        window.onload = function() {
            fetch('database.json')
                .then(res => res.json())
                .then(data => { megaDatabase = data; })
                .catch(err => console.log("Ошибка: ", err));
            addBotMessage("Привет! Я — ИИ-помощник. Мой движок оптимизирован Радисом, лаги устранены! ⚡\nНапиши ключевое слово (например: дискриминант, пифагор, косинус, корни, ом, мчс), и я мгновенно выдам шпору!");
        };
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
        function addBotMessage(text) {
            const box = document.getElementById("ai-messages");
            const m = document.createElement("div"); m.className = "msg bot"; m.innerText = text; box.appendChild(m); box.scrollTop = box.scrollHeight;
        }
        function sendAiMessage() {
            const inp = document.getElementById("ai-input"); const txt = inp.value.trim().toLowerCase(); if(!txt) return;
            const box = document.getElementById("ai-messages"); const m = document.createElement("div"); m.className = "msg user"; m.innerText = inp.value; box.appendChild(m); inp.value = "";
            setTimeout(() => {
                if(txt.includes("бля") || txt.includes("хуй") || txt.includes("пизд")) { addBotMessage("Мат запрещен!"); return; }
                if(!megaDatabase.oge_algebra_vault) { addBotMessage("База данных еще синхронизируется, подожди 5 секунд..."); return; }
                if(txt.includes("дискрим") || txt.includes("уравнен")) { addBotMessage(megaDatabase.oge_algebra_vault.discriminant_formula + "\n" + megaDatabase.oge_algebra_vault.d_positive_info + "\n" + megaDatabase.oge_algebra_vault.d_positive_x1 + "\n" + megaDatabase.oge_algebra_vault.d_positive_x2); }
                else if(txt.includes("виет")) { addBotMessage(megaDatabase.oge_algebra_vault.vieta_theorem_sum + "\n" + megaDatabase.oge_algebra_vault.vieta_theorem_product); }
                else if(txt.includes("шпор") || txt.includes("фсу") || txt.includes("квадрат")) { addBotMessage(megaDatabase.oge_algebra_vault.fsu_square_sum + "\n" + megaDatabase.oge_algebra_vault.fsu_square_diff + "\n" + megaDatabase.oge_algebra_vault.fsu_diff_squares); }
                else if(txt.includes("пифагор") || txt.includes("катет") || txt.includes("гипотенуз")) { addBotMessage(megaDatabase.oge_geometry_vault.pythagoras_theorem + "\n" + megaDatabase.oge_geometry_vault.pythagoras_formula + "\n" + megaDatabase.oge_geometry_vault.pythagoras_hypotenuse); }
                else if(txt.includes("площад") || txt.includes("треугол") || txt.includes("трапец")) { addBotMessage(megaDatabase.oge_geometry_vault.triangle_area_formula + "\n" + megaDatabase.oge_geometry_vault.rectangle_area_formula + "\n" + megaDatabase.oge_geometry_vault.trapezoid_area_formula); }
                else if(txt.includes("синус") || txt.includes("косинус")) { addBotMessage(megaDatabase.oge_geometry_vault.sine_angle_definition + "\n" + megaDatabase.oge_geometry_vault.cosine_angle_definition + "\n" + megaDatabase.oge_geometry_vault.trigonometric_identity); }
                else if(txt.includes("корен") || txt.includes("гар") || txt.includes("гор") || txt.includes("чередов")) { addBotMessage(megaDatabase.oge_russian_vault.root_gar_gor_rule + "\n" + megaDatabase.oge_russian_vault.root_rast_rasch_ros + "\n" + megaDatabase.oge_russian_vault.root_lag_lozh_rule); }
                else if(txt.includes("запят") || txt.includes("причаст") || txt.includes("деепричаст")) { addBotMessage(megaDatabase.oge_russian_vault.punctuation_commas + "\n" + megaDatabase.oge_russian_vault.participle_commas + "\n" + megaDatabase.oge_russian_vault.adverbial_commas); }
                else if(txt.includes("ньютон") || txt.includes("закон")) { addBotMessage(megaDatabase.oge_physics_vault.newtons_first_law + "\n" + megaDatabase.oge_physics_vault.newtons_second_law + "\n" + megaDatabase.oge_physics_vault.newtons_third_law); }
                else if(txt.includes("ом") || txt.includes("ток") || txt.includes("сопротивл")) { addBotMessage(megaDatabase.oge_physics_vault.ohm_law_for_circuit + "\n" + megaDatabase.oge_physics_vault.electrical_resistance); }
                else if(txt.includes("мчс") || txt.includes("сирен") || txt.includes("бпла") || txt.includes("тревог")) { addBotMessage(megaDatabase.emergency_mchs_protocol.global_alert_sound + "\n" + megaDatabase.emergency_mchs_protocol.air_alarm_evacuation + "\n" + megaDatabase.emergency_mchs_protocol.uav_attack_danger + "\n" + megaDatabase.emergency_mchs_protocol.unknown_items_ban + "\nВызов: " + megaDatabase.emergency_mchs_protocol.emergency_phone); }
                else { addBotMessage("Информация ищется... Напиши точнее: дискриминант, виета, пифагор, площадь, косинус, корни, законы, ом или мчс 🛡️"); }
            }, 400);
        }
    </script>
</body>
</html>
